[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    lint: linters sur le code de SDP (ESLint, hadolint, ShellCheck, actionlint), sans rien construire
    static: analyses statiques (Trivy, systemd) à lancer avant le déploiement
    functional: tests sur l'application déployée (SDP_URL)
    fuzz: scan actif OWASP ZAP de l'application déployée (inclus dans functional)
